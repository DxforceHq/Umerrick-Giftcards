name: U_MERRICK CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MySQL build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: umerrick.settings.development
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py check
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: umerrick.settings.development
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py test giftcards
