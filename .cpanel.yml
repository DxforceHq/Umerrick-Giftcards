---
deployment:
  tasks:
    # Application directory
    - export APP_ROOT=/home/clocojzu/repo/umerrick

    # Existing Python virtual environment
    - export VENV_PYTHON=/home/clocojzu/virtualenv/repo/umerrick/3.13/bin/python

    # Check the paths and private environment before installing or restarting
    - test -f "$APP_ROOT/manage.py" && test -f "$APP_ROOT/passenger_wsgi.py" && test -f "$APP_ROOT/.env.production" && test -x "$VENV_PYTHON"

    # Install dependencies
    - cd "$APP_ROOT" && "$VENV_PYTHON" -m pip install -r requirements.txt

    # Collect Django static files
    - cd "$APP_ROOT" && "$VENV_PYTHON" -c "import passenger_wsgi; from django.core.management import call_command; call_command('collectstatic', interactive=False)"

    # Restart Passenger
    - /bin/mkdir -p "$APP_ROOT/tmp"
    - /usr/bin/touch "$APP_ROOT/tmp/restart.txt"
