---
---
deployment:
  tasks:
    - export APP_ROOT=/home/clocojzu/umerrick_app
    - export PYTHON=/home/clocojzu/virtualenv/umerrick_app/3.13/bin/python

    # Verify production configuration
    - test -f "$APP_ROOT/passenger_wsgi.py"
    - test -f "$APP_ROOT/.env.production"
    - test -x "$PYTHON"

    # Collect static files using production settings
    - cd "$APP_ROOT" && "$PYTHON" -c "import passenger_wsgi; from django.core.management import call_command; call_command('collectstatic', interactive=False)"

    # Restart Passenger
    - /bin/mkdir -p "$APP_ROOT/tmp"
    - /usr/bin/touch "$APP_ROOT/tmp/restart.txt"