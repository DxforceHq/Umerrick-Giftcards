---
deployment:
  tasks:
    - export REPO=/home/clocojzu/repo/umerrick_app
    - export LIVE=/home/clocojzu/umerrick_app
    - export PYTHON=/home/clocojzu/virtualenv/umerrick_app/3.13/bin/python

    # Verify production files
    - test -f "$LIVE/passenger_wsgi.py"
    - test -f "$LIVE/manage.py"
    - test -f "$LIVE/.env.production"
    - test -x "$PYTHON"

    # Copy updated code without overwriting production files
    - /usr/bin/rsync -av --exclude='.git/' --exclude='.github/' --exclude='.env*' --exclude='passenger_wsgi.py' --exclude='manage.py' --exclude='db.sqlite3' --exclude='staticfiles/' --exclude='media/' --exclude='__pycache__/' "$REPO/" "$LIVE/"

    # Collect static files using production settings
    - cd "$LIVE" && "$PYTHON" -c "import passenger_wsgi; from django.core.management import call_command; call_command('collectstatic', interactive=False)"