---
deployment:
  tasks:
    - export REPO=/home/clocojzu/repo/umerrick_app
    - export LIVE=/home/clocojzu/umerrick_app

    - test -f "$LIVE/passenger_wsgi.py"
    - test -f "$LIVE/manage.py"
    - test -f "$LIVE/.env.production"

    - /usr/bin/rsync -av --exclude='.git/' --exclude='.github/' --exclude='.env*' --exclude='passenger_wsgi.py' --exclude='manage.py' --exclude='db.sqlite3' --exclude='staticfiles/' --exclude='media/' --exclude='__pycache__/' "$REPO/" "$LIVE/"